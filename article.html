<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸飞机账号购买 | TG账号购买</title>
<meta name="robots" content="index,follow">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
:root{
    --main-color:#0a499d;
    --light-color:#e8f0ff;
    --text-gray:#666;--white:#fff;
}
body{background:var(--light-color);padding:40px 20px;line-height:1.8}
.container{max-width:900px;margin:0 auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 2px 8px rgba(10,73,157,0.1)}
.back{display:inline-block;margin-bottom:20px;color:var(--main-color);text-decoration:none}
/* 顶部按钮样式 */
.top-btn-wrap{
    display:flex;
    gap:20px;
    margin-bottom:24px;
}
.top-btn{
    padding:10px 24px;
    background:#0a499d;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}
.top-btn:hover{
    background:#083b7f;
}
.home-btn{
    background:#dc2626;
    color:#000;
}
.home-btn:hover{
    background:#b91c1c;
}
h1{color:#222;margin-bottom:10px;font-size:28px}
.meta{color:#666;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #eee}
#article-content h2{border-left:4px solid var(--main-color);padding-left:10px;margin:24px 0}
#article-content p{margin:16px 0}
#article-content pre{background:#f4f4f4;padding:16px;border-radius:8px;overflow-x:auto}
#article-content code{background:#f4f4f4;padding:2px 4px;border-radius:4px}
</style>
</head>
<body>
<div class="container">
    <!-- 顶部醒目按钮区域 -->
    <div class="top-btn-wrap">
        <a href="https://www.kkpp.us" class="top-btn home-btn">点击进入购买</a>
        <a href="https://www.kkpp.us" target="_blank" class="top-btn">🔍 访问官方</a>
    </div>
    <a href="./index.html" class="back">← 返回首页</a>
    <h1 id="article-title"></h1>
    <div class="meta" id="article-meta"></div>
    <div id="article-content"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const fileName = params.get('file');
if(!fileName){
    document.body.innerHTML = "<div class='container'><h2>文章不存在</h2><a href='index.html'>返回首页</a></div>";
}else{
    fetch(`./posts/${fileName}`)
    .then(res=>{
        if(!res.ok) throw new Error("404");
        return res.text();
    })
    .then(mdText=>{
        //解析frontmatter
        const fmReg = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
        const match = mdText.match(fmReg);
        let meta = {}, content = mdText;
        if(match){
            const fmText = match[1];
            content = match[2];
            fmText.split(/\r?\n/).forEach(line=>{
                const kv = line.split(":");
                if(kv.length>=2){
                    const k = kv[0].trim();
                    const v = kv.slice(1).join(":").trim();
                    meta[k]=v;
                }
            })
        }
        document.getElementById("article-title").innerText = meta.title || fileName;
        document.getElementById("article-meta").innerText = meta.date ? `发布时间：${meta.date}` : "";
        document.getElementById("article-content").innerHTML = marked.parse(content);
    })
    .catch(err=>{
        document.getElementById("article-content").innerHTML = "<p>文章加载失败，文件可能丢失</p>";
    })
}
</script>
</body>
</html>
